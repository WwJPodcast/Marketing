name: Reach nightly build

on:
  schedule:
    # GitHub sometimes skips a scheduled run, so there are two a night. The build is
    # safe to run twice: the second run just refreshes the same numbers.
    # 07:17 UTC = 2:17 AM Central in summer, 1:17 AM in winter (always after midnight)
    - cron: "17 7 * * *"
    # 11:43 UTC = 6:43 AM Central in summer, 5:43 AM in winter (YouTube is more complete by then)
    - cron: "43 11 * * *"
  workflow_dispatch:
  push:
    branches: [main, Analytics]
    paths:
      # Your WWJ Scheduler pushes status.json around 2:53 AM Central every night.
      # GitHub's clock-based schedule above is unreliable, but a push always starts
      # a run, so this is the dependable nightly trigger.
      - "status.json"
      - "reach/build.py"
      - "reach/template.html"
      - ".github/workflows/reach.yml"

permissions:
  contents: write

concurrency:
  group: reach-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull numbers and build the page
        run: python3 reach/build.py
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

      - name: Save the results
        run: |
          git config user.name "wwj-reach-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reach/data.json reach/history.json reach/index.html
          if [ -f reach/fb_posts.json ]; then git add reach/fb_posts.json; fi
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "reach: numbers through $(date -u +%F)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
