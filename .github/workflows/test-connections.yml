name: Test connections

on:
  workflow_dispatch:
  push:
    branches: [Analytics]
    paths:
      - "analytics/test_connections.py"
      - ".github/workflows/test-connections.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check YouTube, Facebook and Buffer
        run: python3 analytics/test_connections.py
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
