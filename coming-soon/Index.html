<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identifying Jesus' Commandments</title>
<meta name="description" content="Identifying Jesus' Commandments by Bill Prince, Jr. — coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF7EC;
    --ink: #2A2521;
    --gold: #C4A059;
    --gold-deep: #A8873F;
    --gold-soft: #E4D6B8;
    --shadow: rgba(42, 37, 33, 0.16);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    width: 100%;
    background: var(--cream);
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--ink);
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5vmin;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1.25rem, 3.5vmin, 2.5rem);
    width: 100%;
  }

  .cover {
    flex: 0 1 auto;
    max-height: 42vh;
    max-width: min(60vw, 340px);
    display: flex;
  }

  .cover img {
    display: block;
    width: 100%;
    height: 100%;
    max-height: 42vh;
    object-fit: contain;
    border: 1px solid var(--gold-soft);
    box-shadow: 0 1.2vmin 3vmin var(--shadow);
    background: var(--cream);
  }

  .divider {
    flex: 0 0 auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    width: min(50vw, 320px);
    height: 1px;
  }

  .message {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1.25rem, 3vmin, 2rem);
    width: 100%;
  }

  .banner {
    margin: 0;
    font-weight: 600;
    font-style: normal;
    letter-spacing: clamp(0.35rem, 1.4vmin, 0.9rem);
    text-transform: uppercase;
    color: var(--gold);
    font-size: clamp(2rem, 8vmin, 5.5rem);
    line-height: 1;
    text-align: center;
    text-wrap: balance;
    white-space: nowrap;
  }

  /* ── Email signup form ───────────────────────────────────────────────── */
  .signup {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    width: min(100%, 380px);
  }

  .signup label {
    font-size: clamp(1.1rem, 2.4vmin, 1.4rem);
    font-style: italic;
    text-align: center;
    line-height: 1.25;
  }

  .signup .row {
    display: flex;
    width: 100%;
    gap: 0.5rem;
  }

  .signup input[type="email"] {
    flex: 1 1 auto;
    min-width: 0;
    padding: 0.7rem 0.9rem;
    font-family: inherit;
    font-size: 1.1rem;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--gold-soft);
    border-radius: 2px;
  }

  .signup input[type="email"]:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  .signup button {
    flex: 0 0 auto;
    padding: 0.7rem 1.2rem;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    background: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .signup button:hover,
  .signup button:focus-visible {
    background: var(--gold-deep);
    border-color: var(--gold-deep);
  }

  /* Honeypot field: hidden from people, catches basic spam bots */
  .hp {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }

  /* ── Landscape: side-by-side composition ─────────────────────────────── */
  @media (orientation: landscape) {
    .stage {
      flex-direction: row;
      gap: clamp(2rem, 5vw, 4.5rem);
    }

    .cover {
      max-height: 82vh;
      max-width: min(34vw, 420px);
    }

    .cover img {
      max-height: 82vh;
    }

    .divider {
      background: linear-gradient(180deg, transparent, var(--gold), transparent);
      width: 1px;
      height: min(50vh, 300px);
    }

    .message {
      width: auto;
      max-width: 42vw;
    }

    .banner {
      font-size: clamp(2.2rem, 5.4vw, 4.8rem);
      white-space: normal;
    }
  }

  /* ── Very narrow phones ──────────────────────────────────────────────── */
  @media (orientation: portrait) and (max-width: 380px) {
    .banner { font-size: clamp(1.9rem, 11vmin, 3.4rem); }
    .signup .row { flex-direction: column; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="cover">
      <img src="cover.jpg" alt="Identifying Jesus' Commandments — book cover">
    </div>
    <div class="divider"></div>
    <div class="message">
      <p class="banner">Coming&nbsp;Soon</p>

      <form class="signup" action="https://api.staticforms.dev/submit" method="POST">
        <input type="hidden" name="apiKey" value="sf_3da771d38e445708376cc5df">
        <!-- Where to send people after they submit -->
        <input type="hidden" name="redirectTo" value="https://wwjesuspodcast.github.io/marketing/coming-soon/thank-you.html">
        <input type="hidden" name="subject" value="New book notification signup">

        <!-- Honeypot (leave empty) -->
        <input type="text" name="honeypot" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

        <label for="email">Get notified when the book is released</label>
        <div class="row">
          <input type="email" id="email" name="email" placeholder="Your email address" autocomplete="email" required>
          <button type="submit">Notify Me</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.staticforms.dev/scripts/staticforms.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      StaticForms.attach(document.querySelector('.signup'));
    });
  </script>
</body>
</html>
