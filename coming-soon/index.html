<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identifying Jesus' Commandments</title>
<meta name="description" content="Identifying Jesus' Commandments by Bill Prince, Jr. — coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF7EC;
    --ink: #2A2521;
    --gold: #C4A059;
    --gold-soft: #E4D6B8;
    --shadow: rgba(42, 37, 33, 0.16);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--cream);
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--ink);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5vmin;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1.5rem, 4vmin, 3rem);
    width: 100%;
    height: 100%;
  }

  .cover {
    flex: 0 1 auto;
    max-height: 56vh;
    max-width: min(72vw, 420px);
    display: flex;
  }

  .cover img {
    display: block;
    width: 100%;
    height: 100%;
    max-height: 56vh;
    object-fit: contain;
    border: 1px solid var(--gold-soft);
    box-shadow: 0 1.2vmin 3vmin var(--shadow);
    background: var(--cream);
  }

  .divider {
    flex: 0 0 auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    width: min(50vw, 320px);
    height: 1px;
  }

  .banner {
    flex: 0 0 auto;
    margin: 0;
    font-weight: 600;
    font-style: normal;
    letter-spacing: clamp(0.35rem, 1.4vmin, 0.9rem);
    text-transform: uppercase;
    color: var(--gold);
    font-size: clamp(2.2rem, 9vmin, 6.5rem);
    line-height: 1;
    text-align: center;
    text-wrap: balance;
    white-space: nowrap;
  }

  /* ── Landscape: side-by-side composition ─────────────────────────────── */
  @media (orientation: landscape) {
    .stage {
      flex-direction: row;
      gap: clamp(2rem, 5vw, 4.5rem);
    }

    .cover {
      max-height: 82vh;
      max-width: min(38vw, 460px);
    }

    .cover img {
      max-height: 82vh;
    }

    .divider {
      background: linear-gradient(180deg, transparent, var(--gold), transparent);
      width: 1px;
      height: min(46vh, 280px);
    }

    .banner {
      font-size: clamp(2.4rem, 6.4vw, 5.5rem);
      white-space: normal;
      max-width: 42vw;
    }
  }

  /* ── Very narrow phones: keep the banner from crowding the cover ────── */
  @media (orientation: portrait) and (max-width: 380px) {
    .banner { font-size: clamp(1.9rem, 11vmin, 3.4rem); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="cover">
      <img src="cover.jpg" alt="Identifying Jesus' Commandments — book cover">
    </div>
    <div class="divider"></div>
    <p class="banner">Coming&nbsp;Soon</p>
  </div>
</body>
</html>
