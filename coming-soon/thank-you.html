<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Identifying Jesus' Commandments</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root { --cream: #FBF7EC; --ink: #2A2521; --gold: #C4A059; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 2rem;
    text-align: center;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
  }
  h1 {
    font-weight: 600;
    letter-spacing: 0.3rem;
    text-transform: uppercase;
    color: var(--gold);
    font-size: clamp(2rem, 7vw, 3.5rem);
  }
  p { font-size: 1.4rem; font-style: italic; }
  a { color: var(--gold); }
</style>
</head>
<body>
  <h1>Thank You</h1>
  <p>You're on the list. We'll email you when the book is released.</p>
  <p><a href="./">Back to the book</a></p>
</body>
</html>
