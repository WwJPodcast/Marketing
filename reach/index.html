<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WWJ Reach</title>
<meta name="theme-color" content="#fffdf8">
<style>
/* Layout: phone-first page in the WWJ Posts house style; a mockup switcher on top, then one of three layouts of the same five platforms. */
:root{
  --bg:#fffdf8; --ink:#2b2620; --mute:#7c7366; --line:#e3dccf; --panel:#fbf7ef; --empty:#efe8dc;
  --views:#2e7a4f; --eng:#b8780f; --up:#2e7a4f; --down:#b4472f; --chip:#2f5a40; --chip-ink:#fffdf8;
  --yt:#cc0000; --fb:#0866ff; --ig:#e1306c; --tt:#0b9aa2; --pin:#bd081c;
  --display:Georgia,"Times New Roman",serif;
  --body:-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1a17; --ink:#eee7dc; --mute:#a0968a; --line:#38332c; --panel:#23201c; --empty:#2c2823;
  --views:#3f9a64; --eng:#c4861a; --up:#5fbf84; --down:#e07a62; --chip:#6f9c6a; --chip-ink:#1c1a17;
  --yt:#e02424; --fb:#3d86ff; --ig:#e8457e; --tt:#1aa7ad; --pin:#d9283a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1a17; --ink:#eee7dc; --mute:#a0968a; --line:#38332c; --panel:#23201c; --empty:#2c2823;
  --views:#3f9a64; --eng:#c4861a; --up:#5fbf84; --down:#e07a62; --chip:#6f9c6a; --chip-ink:#1c1a17;
  --yt:#e02424; --fb:#3d86ff; --ig:#e8457e; --tt:#1aa7ad; --pin:#d9283a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:13px/1.4 var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--views);outline-offset:2px;border-radius:4px}

/* page */
.page{margin:0 auto;display:flex;flex-direction:column;gap:14px}
.page.narrow{max-width:430px}
.page.wide{max-width:880px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hd b{font:600 20px var(--display)}
.hd span{color:var(--mute);font-size:11px}
.sample{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--eng);border:1px solid currentColor;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--mute);align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sw.ln{height:3px;border-radius:2px;vertical-align:2px;width:12px}

.sec-t{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.sec-t em{font-style:normal;text-transform:none;letter-spacing:0}

.plat{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.plat-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.plat-h b{font:600 16px var(--display)}
.plat-h small{color:var(--mute);font-size:11px}
.stats{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.stats b{color:var(--ink);font-weight:600}
.delta{font-size:11px;font-weight:600}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--mute)}

.chart{display:flex;flex-direction:column;gap:2px;min-width:0}
.chart-cap{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--mute);min-height:16px}
.chart-cap b{color:var(--ink);font-weight:600}
.chart svg{width:100%;height:auto;display:block;touch-action:manipulation}
.chart text{font:10px var(--body);fill:var(--mute);font-variant-numeric:tabular-nums}
.chart .hit{fill:transparent;cursor:pointer}
.chart .col-hl{fill:var(--ink);opacity:0}
.chart .col-hl.on{opacity:.06}
.empty-note{font-size:11px;color:var(--mute);font-style:italic}

/* layout C: platform bar fixed to the bottom, in thumb reach */
body.has-bar{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar .tabs{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tabs button{background:none;border:0;border-radius:10px;min-height:48px;padding:6px 2px;font-size:11px;cursor:pointer;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--panel);box-shadow:inset 0 -3px 0 var(--pc)}
.tabs button svg{width:20px;height:20px;fill:var(--pc)}
.ico{width:16px;height:16px;fill:var(--pc);flex:none}
.plat-h b{display:inline-flex;align-items:center;gap:7px}
.mini-row .nm{display:flex;align-items:center;gap:6px;min-width:0}
.tabs button:active{background:var(--empty)}
.big{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.big div{display:flex;flex-direction:column;gap:1px}
.big b{font:600 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.big span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.mini-rows{display:flex;flex-direction:column}
.mini-row{display:grid;grid-template-columns:104px 1fr auto;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:12px}
.mini-row .bar{height:8px;border-radius:4px;background:var(--empty);overflow:hidden}
.mini-row .bar i{display:block;height:100%;background:var(--pc,var(--views));border-radius:4px}
.mini-row small{display:block;font-size:10px;color:var(--mute)}
.board-c{display:flex;flex-direction:column;gap:10px}
.pane{display:flex;flex-direction:column;gap:10px}
.rtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border:1px solid var(--line);border-radius:12px;padding:3px}
.rtabs button{background:none;border:0;border-radius:9px;min-height:40px;font-size:12px;cursor:pointer;color:var(--mute)}
.rtabs button[aria-selected="true"]{color:var(--ink);background:var(--panel);box-shadow:inset 0 -3px 0 var(--views);font-weight:600}
.rtabs button:active{background:var(--empty)}

.stale{color:var(--down);font-weight:600}
.foot{font-size:11px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
</style>
</head>

  points.forEach((p,i)=>{if(p.v==null){el('rect',{x:xAt(i),y:vBase-3,width:bw,height:3,rx:1.5,fill:'var(--empty)'},svg);
    if(style==='mirror')el('rect',{x:xAt(i),y:eBase,width:bw,height:3,rx:1.5,fill:'var(--empty)'},svg)}});
  // views bars
  points.forEach((p,i)=>{if(p.v==null)return;const hv=p.v/vMax*(vBase-vTop);
    if(p.v>0)el('path',{d:bar(xAt(i),vBase,bw,Math.max(2,hv),true),fill:'var(--pc,var(--views))'},svg);
    else el('rect',{x:xAt(i),y:vBase-2,width:bw,height:2,fill:'var(--pc,var(--views))',opacity:.35},svg)});
  // engagement
  if(style==='twin'){
    let d='',started=false;const dots=[];
    points.forEach((p,i)=>{if(p.e==null){started=false;return}const x=xAt(i)+bw/2,y=eBase-p.e/eMax*(eBase-eTop);
      d+=(started?'L':'M')+x.toFixed(1)+','+y.toFixed(1);started=true;dots.push([x,y])});
    el('path',{d,fill:'none',stroke:'var(--eng)','stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'},svg);
    dots.forEach(([x,y],k)=>{const last=k===dots.length-1;el('circle',{cx:x,cy:y,r:last?4:2.6,fill:last?'var(--eng)':'var(--bg)',stroke:'var(--eng)','stroke-width':2},svg)});
  }else{
    points.forEach((p,i)=>{if(p.e==null||p.e<=0)return;const he=p.e/eMax*(eTop-eBase);
      el('path',{d:bar(xAt(i)+bw*0.15,eBase+2,bw*0.7,Math.max(2,he-2),false),fill:'var(--eng)'},svg)});
  }
  // x labels
  const lblY=H-6;
  if(!weekly){points.forEach((p,i)=>{el('text',{x:xAt(i)+bw/2,y:lblY,'text-anchor':'middle'},svg).textContent=i===n-1&&sameDay(p.d,YD)?'Yesterday':['S','M','T','W','T','F','S'][p.d.getDay()]})}
  else{let lastM=-1;points.forEach((p,i)=>{const m=p.d.getMonth();if(m!==lastM&&i<n-1){el('text',{x:padL+i*step,y:lblY,'text-anchor':'start'},svg).textContent=MON[m];lastM=m}})}
  // first-data marker on 6-month charts
  if(weekly){const fi=points.findIndex(p=>p.v!=null);
    if(fi>2){const x=padL+fi*step-1;el('line',{x1:x,x2:x,y1:vTop,y2:style==='twin'?eBase:eTop,stroke:'var(--mute)','stroke-dasharray':'2 3',opacity:.7},svg);
      const t=el('text',{x:x-4,y:(vTop+vBase)/2+4,'text-anchor':'end'},svg);t.textContent='Tracking starts';
      const t2=el('text',{x:x-4,y:(vTop+vBase)/2+16,'text-anchor':'end'},svg);t2.textContent='fills in each week'}}
  // hit targets + readout
  let sel=-1;
  const show=i=>{hl.forEach((r,k)=>r.classList.toggle('on',k===i));const p=points[i];
    if(p.v==null){capL.innerHTML=`<b>${weekly?'Week of '+md(p.d):dl(p.d)}</b>`;capR.textContent='No data yet';return}
    capL.innerHTML=`<b>${weekly?'Week of '+md(p.d):dl(p.d)}</b>`;
    capR.innerHTML=`<span class="sw" style="background:var(--pc,var(--views))"></span><b class="num">${full(p.v)}</b> ${opt.vlabel||'views'} · <span class="sw ln" style="background:var(--eng)"></span><b class="num">${full(p.e)}</b> engaged`};
  const clear=()=>{if(sel>=0){show(sel);return}hl.forEach(r=>r.classList.remove('on'));defaultCap()};
  for(let i=0;i<n;i++){const r=el('rect',{x:padL+i*step,y:0,width:step,height:H,class:'hit',tabindex:0,'aria-label':(weekly?'Week of '+md(points[i].d):dl(points[i].d))},svg);
    r.addEventListener('pointerenter',()=>show(i));r.addEventListener('focus',()=>show(i));
    r.addEventListener('click',()=>{sel=sel===i?-1:i;sel<0?clear():show(i)});}
  svg.addEventListener('pointerleave',clear);
  return wrap;
}
function emptyChart(title,name){
  const wrap=h('div','chart');wrap.append(h('div','chart-cap',`<span>${title}</span><span></span>`));
  const svg=el('svg',{viewBox:'0 0 360 92',role:'img','aria-label':title+': no data yet'});
  el('rect',{x:1,y:1,width:358,height:90,rx:8,fill:'none',stroke:'var(--line)','stroke-dasharray':'4 4'},svg);
  const t=el('text',{x:180,y:44,'text-anchor':'middle'},svg);t.textContent='Fills in once '+name+' has posts tracked';
  const t2=el('text',{x:180,y:60,'text-anchor':'middle'},svg);t2.textContent='The first numbers show the night after';
  wrap.append(svg);return wrap}
function spark(p){const svg=el('svg',{viewBox:'0 0 64 20','aria-hidden':'true'});if(!p.daily)return svg;
  const c=cur(p),m=Math.max(1,...c.map(x=>x.v));const bw=6,st=64/7;
  c.forEach((x,i)=>{const hv=x.v/m*18;if(hv>0)el('path',{d:bar(i*st+1,20,bw,Math.max(1.5,hv),true),fill:'var(--pc,var(--views))'},svg)});return svg}

const ico=(k,c)=>`<svg class="${c||'ico'}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[k]}"/></svg>`;
function head(){
  const d=h('div','hd',`<b>WWJ Reach${DATA.sample?'<span class="sample">Sample</span>':''}</b><span>Updated ${DATA.updated}</span>`);return d}
function legend(){return h('div','lg',`<span><span class="sw" style="background:var(--pc,var(--views))"></span>Views</span><span><span class="sw ln" style="background:var(--eng)"></span>Engaged (likes, comments, shares, saves)</span>`)}
function statLine(p){
  if(!p.daily)return h('div','stats','<span>Nothing posted here yet</span>');
  const c=cur(p),pr=prev(p),v=sum(c,'v'),e=sum(c,'e'),dv=delta(v,sum(pr,'v'));
  return h('div','stats num',`<span>Views <b>${full(v)}</b> <span class="delta ${dv.c}">${dv.t}</span></span><span>Engaged <b>${full(e)}</b></span><span>Rate <b>${rate(v,e)}</b></span>`)}
function platHead(p){return h('div','plat-h',`<b>${ico(p.key)}${p.name}</b><small>${p.via}${p.views!=='views'&&p.daily?' · views = '+p.views:''}${p.through&&p.daily?' · through '+md(pd(p.through)):''}${p.stale?' · <span class="stale">not updated since '+p.stale+'</span>':''}</small>`)}
function charts(p,style){
  if(!p.daily)return [emptyChart('Last 7 days',p.name),emptyChart('Last 6 months',p.name)];
  return [chart(cur(p),{title:'Last 7 days',sub:'vs prior 7',style,vlabel:p.views}),
          chart(p.weekly,{title:'Last 6 months',sub:'by week',style,weekly:true,vlabel:p.views})]}

/* ---------- C: overview + one platform at a time ---------- */
function layoutC(root){
  root.className='page narrow';
  root.append(head());
  // scoreboard: three stacked panes (7 days, 6 months, all time), only the selected one visible
  const live=DATA.platforms.filter(p=>p.daily);
  if(!live.length){root.append(h('div','empty-note','No numbers yet. The first nightly run fills this in.'));return}
  const tot=(r,p)=>{if(!p.daily)return null;if(r==='7d')return {v:sum(cur(p),'v'),e:sum(cur(p),'e')};
    const w=p.weekly.filter(x=>x.v!=null),t={v:sum(w,'v'),e:sum(w,'e')};
    if(r==='all'&&p.before){t.v+=p.before.v;t.e+=p.before.e}return t};
  const combined=live[0].weekly.map((x,i)=>{const ws=live.map(p=>p.weekly[i]).filter(w=>w.v!=null);
    return {d:x.d,v:ws.length?sum(ws,'v'):null,e:ws.length?sum(ws,'e'):null}});
  const RANGES=[['7d','7 days','All channels · last 7 days'],['6m','6 months','All channels · last 6 months'],['all','All time','All channels · since each began']];
  const board=h('section','board-c');
  const rtabs=h('div','rtabs');rtabs.setAttribute('role','tablist');rtabs.setAttribute('aria-label','Time range');
  const panes={};
  RANGES.forEach(([r,label,head])=>{
    const ts=live.map(p=>tot(r,p)),TV=sum(ts,'v'),TE=sum(ts,'e');
    let dtxt='';if(r==='7d'){const dt=delta(TV,live.reduce((s,p)=>s+sum(prev(p),'v'),0));dtxt=` <span class="delta ${dt.c}">${dt.t}</span>`}
    const pane=h('div','pane');pane.id='pane-'+r;pane.setAttribute('role','tabpanel');
    pane.append(h('div','sec-t',`<span>${head}</span>`),
      h('div','big',`<div><b>${fmt(TV)}</b><span>Views${dtxt}</span></div><div><b>${full(TE)}</b><span>Engaged</span></div><div><b>${rate(TV,TE)}</b><span>Rate</span></div>`));
    if(r==='6m')pane.append(chart(combined,{title:'All channels by week',sub:'views + engaged',style:'twin',weekly:true}));
    const rows=h('div','mini-rows');const mx=Math.max(1,...ts.map(t=>t.v));
    DATA.platforms.forEach(p=>{const t=tot(r,p);
      const nm=`<span class="nm">${ico(p.key)}<span>${p.name}${r==='all'?`<small>${p.since?'since '+p.since:'starts this week'}</small>`:''}</span></span>`;
      const row=h('div','mini-row num',`${nm}<span class="bar"><i style="width:${t?Math.max(1.5,t.v/mx*100):0}%"></i></span><span>${t?fmt(t.v):'—'}</span>`);row.style.setProperty('--pc',`var(--${p.key})`);rows.append(row)});
    pane.append(rows);panes[r]=pane;
    const b=h('button',null,label);b.type='button';b.id='range-'+r;b.dataset.r=r;b.setAttribute('role','tab');b.setAttribute('aria-controls',pane.id);
    b.addEventListener('click',()=>pickR(r));rtabs.append(b)});
  const pickR=r=>{[...rtabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.r===r));
    for(const k in panes)panes[k].hidden=k!==r;try{localStorage.setItem('wwj-reach-range',r)}catch(e){}};
  board.append(rtabs,...Object.values(panes));root.append(board);
  let rr='7d';try{rr=localStorage.getItem('wwj-reach-range')||'7d'}catch(e){}
  pickR(panes[rr]?rr:'7d');
  const tabs=h('div','tabs');tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','Platform');
  const panel=h('section','plat');panel.setAttribute('role','tabpanel');
  const pick=(k,tap)=>{const p=DATA.platforms.find(x=>x.key===k);panel.style.setProperty('--pc',`var(--${k})`);[...tabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));
    panel.replaceChildren(platHead(p),statLine(p),legend(),...charts(p,'twin'));try{localStorage.setItem('wwj-reach-tab',k)}catch(e){}
    if(tap){const r=panel.getBoundingClientRect();if(r.top<0||r.top>innerHeight*0.6)panel.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}};
  DATA.platforms.forEach(p=>{const b=h('button',null,`${ico(p.key,'')}${p.name}`);b.style.setProperty('--pc',`var(--${p.key})`);b.type='button';b.id='tab-'+p.key;b.dataset.k=p.key;b.setAttribute('role','tab');b.addEventListener('click',()=>pick(p.key,true));tabs.append(b)});
  root.append(panel,foot());
  const bar=h('nav','tabbar');bar.append(tabs);document.body.append(bar);document.body.classList.add('has-bar');
  let k='fb';try{k=localStorage.getItem('wwj-reach-tab')||'fb'}catch(e){}
  pick(DATA.platforms.some(p=>p.key===k)?k:'fb');
}
function foot(){return h('div','foot',`<span>Views follow each platform's own count: plays on YouTube, Instagram and TikTok, and content views on Facebook.</span><span>Engaged adds likes or reactions, comments, shares and saves. On Facebook it is Meta's post engagement count, which also includes clicks.</span><span>YouTube and Facebook report their own history. Instagram, TikTok and Pinterest come from Buffer, which only keeps 31 days, so each night's totals are saved to build the longer graphs.</span><span>YouTube reports a day or two late, so its graphs stop at the last day it has reported. The date is next to its name.</span><span>For Instagram, TikTok and Pinterest, history from before tracking began counts each post's views on the day it was posted, not the days people watched it.</span>`)}

layoutC(document.getElementById('app'));
})();
