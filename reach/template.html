<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WWJ Reach</title>
<meta name="theme-color" content="#fffdf8">
<style>
/* Layout: phone-first page in the WWJ Posts house style; a mockup switcher on top, then one of three layouts of the same five platforms. */
:root{
  --bg:#fffdf8; --ink:#2b2620; --mute:#7c7366; --line:#e3dccf; --panel:#fbf7ef; --empty:#efe8dc;
  --views:#2e7a4f; --eng:#b8780f; --up:#2e7a4f; --down:#b4472f; --chip:#2f5a40; --chip-ink:#fffdf8;
  --long:#2f6fa8; --yt:#cc0000; --fb:#0866ff; --ig:#e1306c; --tt:#0b9aa2; --pin:#bd081c;
  --display:Georgia,"Times New Roman",serif;
  --body:-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1a17; --ink:#eee7dc; --mute:#a0968a; --line:#38332c; --panel:#23201c; --empty:#2c2823;
  --views:#3f9a64; --eng:#c4861a; --up:#5fbf84; --down:#e07a62; --chip:#6f9c6a; --chip-ink:#1c1a17;
  --long:#5b9bd5; --yt:#e02424; --fb:#3d86ff; --ig:#e8457e; --tt:#1aa7ad; --pin:#d9283a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1a17; --ink:#eee7dc; --mute:#a0968a; --line:#38332c; --panel:#23201c; --empty:#2c2823;
  --views:#3f9a64; --eng:#c4861a; --up:#5fbf84; --down:#e07a62; --chip:#6f9c6a; --chip-ink:#1c1a17;
  --long:#5b9bd5; --yt:#e02424; --fb:#3d86ff; --ig:#e8457e; --tt:#1aa7ad; --pin:#d9283a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:13px/1.4 var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--views);outline-offset:2px;border-radius:4px}

/* page */
.page{margin:0 auto;display:flex;flex-direction:column;gap:14px}
.page.narrow{max-width:430px}
.page.wide{max-width:880px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hd b{font:600 20px var(--display)}
.hd span{color:var(--mute);font-size:11px}
.sample{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--eng);border:1px solid currentColor;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--mute);align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sw.ln{height:3px;border-radius:2px;vertical-align:2px;width:12px}

.sec-t{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.sec-t em{font-style:normal;text-transform:none;letter-spacing:0}

.plat{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.plat-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.plat-h b{font:600 16px var(--display)}
.plat-h small{color:var(--mute);font-size:11px}
.stats{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.stats b{color:var(--ink);font-weight:600}
.delta{font-size:11px;font-weight:600}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--mute)}

.chart{display:flex;flex-direction:column;gap:2px;min-width:0}
.chart-cap{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--mute);min-height:16px}
.chart-cap b{color:var(--ink);font-weight:600}
.chart svg{width:100%;height:auto;display:block;touch-action:manipulation}
.chart text{font:10px var(--body);fill:var(--mute);font-variant-numeric:tabular-nums}
.chart .hit{fill:transparent;cursor:pointer}
.chart .col-hl{fill:var(--ink);opacity:0}
.chart .col-hl.on{opacity:.06}
.empty-note{font-size:11px;color:var(--mute);font-style:italic}

/* layout C: platform bar fixed to the bottom, in thumb reach */
body.has-bar{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar .tabs{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tabs button{background:none;border:0;border-radius:10px;min-height:48px;padding:6px 0;font-size:10.5px;cursor:pointer;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--panel);box-shadow:inset 0 -3px 0 var(--pc)}
.tabs button svg{width:20px;height:20px;fill:var(--pc)}
.ico{width:16px;height:16px;fill:var(--pc);flex:none}
.sec-t>span:has(>.ico){display:inline-flex;align-items:center;gap:6px}
.plat-h b{display:inline-flex;align-items:center;gap:7px}
.mini-row .nm{display:flex;align-items:center;gap:6px;min-width:0}
.tabs button:active{background:var(--empty)}
.big{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.big div{display:flex;flex-direction:column;gap:1px}
.big b{font:600 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.big span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.mini-rows{display:flex;flex-direction:column}
.mini-row{display:grid;grid-template-columns:104px 1fr auto;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:12px}
.mini-row .bar{height:8px;border-radius:4px;background:var(--empty);overflow:hidden}
.mini-row .bar i{display:block;height:100%;background:var(--pc,var(--views));border-radius:4px}
.mini-row small{display:block;font-size:10px;color:var(--mute)}
.board-c{display:flex;flex-direction:column;gap:10px}
.pane{display:flex;flex-direction:column;gap:10px}
.rtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border:1px solid var(--line);border-radius:12px;padding:3px}
.rtabs button{background:none;border:0;border-radius:9px;min-height:40px;font-size:12px;cursor:pointer;color:var(--mute)}
.rtabs button[aria-selected="true"]{color:var(--ink);background:var(--panel);box-shadow:inset 0 -3px 0 var(--views);font-weight:600}
.rtabs button:active{background:var(--empty)}

.split-sec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.posts{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.posts .sum{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mute)}
.posts .sum b{color:var(--ink);font-weight:600}
.posts .sum i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0 7px 8px;border-top:1px solid var(--line);border-left:3px solid var(--views);font-size:12px}
.prow.long{border-left-color:var(--long)}
.prow .x{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .v{font-weight:600;text-align:right}
.prow small{color:var(--mute);font-size:11px;grid-column:1/-1}
.prow .tag{font-size:9px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.prow.long .tag{color:var(--long)}.prow.up .tag{color:var(--eng)}
.tgrid{display:grid;gap:0;font-size:12px;align-items:stretch}
.tgrid>span{padding:6px 4px;border-top:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.tgrid .th{border-top:0;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);text-align:right;justify-content:flex-end}
.tgrid .tn{padding-left:0;justify-content:flex-start;padding-top:8px}
.tgrid .tc{text-align:right;display:flex;flex-direction:column;justify-content:flex-start}
.tgrid .tc small{color:var(--mute);font-size:10px}
.tgrid .tc.early b{color:var(--mute);font-weight:400}
.tgrid .tc.best b{color:var(--eng)}
.goal{display:flex;flex-direction:column;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.goal h3{margin:0;font:600 14px var(--display)}
.gtop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gtop b{font:600 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.gtop span{color:var(--mute);font-size:12px}
.gtop em{font-style:normal;font-weight:600;margin-left:auto;color:var(--eng)}
.gbar{height:8px;border-radius:4px;background:var(--empty);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--eng);min-width:3px}
.gnote{font-size:11px;color:var(--mute)}
.gsub{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.more{align-self:flex-start;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--mute);cursor:pointer;min-height:36px}
.more:active{background:var(--empty)}
.chg{border:1px solid var(--eng);border-radius:10px;padding:8px 12px;background:var(--panel);font-size:12px}
.chg summary{cursor:pointer;font-weight:600;color:var(--eng);display:flex;justify-content:space-between;gap:8px;align-items:baseline;min-height:24px}
.chg summary small{font-weight:400;color:var(--mute);font-size:11px}
.chg[open] summary small{display:none}
.chg-i{display:flex;flex-direction:column;gap:1px;padding:6px 0;border-top:1px solid var(--line)}
.chg-i:first-of-type{margin-top:6px}
.chg-i b{font-weight:600}.chg-i span{color:var(--mute)}
.chg-f{font-size:11px;color:var(--mute);border-top:1px solid var(--line);padding-top:6px}
.chg-p{border-left:3px solid var(--eng);padding-left:8px;font-size:12px}
.chg-p .chg-i{border:0;padding:2px 0}
.stale{color:var(--down);font-weight:600}
.foot{font-size:11px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
</style>
</head>
<body>
<main id="app"></main>

<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const DAY=864e5;

/* ---------- data: build.py fills in the JSON below every night ---------- */
const DATA=__DATA_JSON__;
const pd=s=>{if(s==null)return null;const q=s.split('-').map(Number);return new Date(q[0],q[1]-1,q[2])};
const YD=(q=>new Date(q[0],q[1]-1,q[2]-1))(DATA.updated_date.split('-').map(Number)); // the run's "yesterday"
const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
DATA.platforms.forEach(p=>{
  if(p.daily)p.daily=p.daily.map(x=>({d:pd(x.d),v:x.v,e:x.e}));
  if(p.weekly)p.weekly=p.weekly.map(x=>({d:pd(x.d),v:x.v,e:x.e}));
  if(p.split){
    if(!p.split.shorts||!p.split.long||!p.split.shorts.daily||!p.split.long.daily)p.split=null;
    else['shorts','long'].forEach(k=>{const s=p.split[k];
      s.daily=s.daily.map(x=>({d:pd(x.d),v:x.v,e:x.e}));s.weekly=s.weekly.map(x=>({d:pd(x.d),v:x.v,e:x.e}))})}
});

/* ---------- method changes (reach/events.json) ---------- */
DATA.events=(DATA.events||[]).map(e=>Object.assign({},e,{d:pd(e.date)})).filter(e=>e.d&&!e.hidden).sort((a,b)=>b.d-a.d);
const evFor=p=>DATA.events.filter(e=>(e.platforms||[]).includes(p.key));
DATA.platforms.forEach(p=>{const st=evFor(p).filter(e=>(e.stops||[]).includes(p.key)).map(e=>e.d)[0];
  if(st){p.stopped=st;['daily','weekly'].forEach(k=>{if(p[k])p[k]=p[k].map(x=>x.d>=st?{d:x.d,v:null,e:null}:x)})}});

/* ---------- helpers ---------- */
const fmt=n=>n==null?'—':n>=10000?(n/1000).toFixed(1).replace(/\.0$/,'')+'k':n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'k':String(n);
const full=n=>n==null?'—':n.toLocaleString('en-US');
const dl=d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate();
const md=d=>(d.getMonth()+1)+'/'+d.getDate();
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function nice(m){if(m<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(m)));const f=m/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
// bar with rounded data end (top when up, bottom when down)
function bar(x,y0,w,hgt,up){const r=Math.min(4,w/2,Math.abs(hgt));if(hgt<=0)return '';
  if(up){const y=y0-hgt;return `M${x},${y0}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y0}Z`}
  const y=y0+hgt;return `M${x},${y0}V${y-r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y-r}V${y0}Z`}
function sum(a,k){return a.reduce((s,x)=>s+(x[k]||0),0)}
function cur(p){return p.daily.slice(7)}
function prev(p){return p.daily.slice(0,7)}
function delta(now,before){if(!before)return now?{t:'new',c:'up'}:{t:'—',c:'flat'};const r=(now-before)/before;const pct=Math.round(r*100);
  return {t:(pct>0?'▲ ':pct<0?'▼ ':'')+Math.abs(pct)+'%',c:pct>0?'up':pct<0?'down':'flat'}}
function rate(v,e){return v?(e/v*100).toFixed(1)+'%':'—'}

/* ---------- chart: shared dates, views on top, engagement below ---------- */
// style 'twin' = views bars over an engagement line; 'mirror' = views up, engaged down from one baseline
function chart(points,opt){
  const W=360,padL=30,padR=6,style=opt.style||'twin',weekly=!!opt.weekly;
  const H=style==='twin'?150:150;
  const wrap=h('div','chart');
  const cap=h('div','chart-cap');const capL=h('span');const capR=h('span');cap.append(capL,capR);
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'});
  wrap.append(cap,svg);
  const n=points.length,plotW=W-padL-padR,step=plotW/n;
  const bw=Math.max(3,Math.min(step*(weekly?0.62:0.5),26));
  const have=points.filter(p=>p.v!=null);
  const vMax=nice(Math.max(1,...have.map(p=>p.v))),eMax=nice(Math.max(1,...have.map(p=>p.e)));
  const mk=[];
  const defaultCap=()=>{capL.innerHTML=opt.title;capR.innerHTML=(opt.sub||'')+(mk.some(m=>m.i<0)?` · <span style="color:var(--eng)">⚑ change ${md(mk.find(m=>m.i<0).ev.d)} →</span>`:'')};
  defaultCap();
  svg.setAttribute('aria-label',opt.title.replace(/<[^>]+>/g,'')+': views and engagement');
  let vTop,vBase,eTop,eBase;
  if(style==='twin'){vTop=10;vBase=88;eTop=100;eBase=128}
  else{vTop=8;vBase=78;eBase=78;eTop=124}
  const xAt=i=>padL+i*step+(step-bw)/2;
  const hl=[];
  // highlight columns (under marks)
  for(let i=0;i<n;i++){hl.push(el('rect',{x:padL+i*step,y:vTop-4,width:step,height:(style==='twin'?eBase:eTop)-vTop+8,class:'col-hl'},svg))}
  // grid + scale labels
  const gl=(y)=>el('line',{x1:padL,x2:W-padR,y1:y,y2:y,stroke:'var(--line)','stroke-width':1},svg);
  gl(vTop);gl((vTop+vBase)/2);el('line',{x1:padL,x2:W-padR,y1:vBase,y2:vBase,stroke:'var(--mute)','stroke-width':1,opacity:.5},svg);
  el('text',{x:padL-5,y:vTop+3,'text-anchor':'end'},svg).textContent=fmt(vMax);
  el('text',{x:padL-5,y:vBase+3,'text-anchor':'end'},svg).textContent='0';
  if(style==='twin'){
    gl(eTop);el('line',{x1:padL,x2:W-padR,y1:eBase,y2:eBase,stroke:'var(--mute)','stroke-width':1,opacity:.5},svg);
    el('text',{x:padL-5,y:eTop+3,'text-anchor':'end'},svg).textContent=fmt(eMax);
    el('text',{x:padL-5,y:eBase+3,'text-anchor':'end'},svg).textContent='0';
  }else{
    gl(eTop);
    el('text',{x:padL-5,y:eTop+3,'text-anchor':'end'},svg).textContent=fmt(eMax);
  }
  // panel labels
  el('text',{x:W-padR,y:vTop-2+ (style==='twin'?0:0),'text-anchor':'end'},svg).textContent='Views';
  el('text',{x:W-padR,y:(style==='twin'?eTop-2:eTop-3),'text-anchor':'end'},svg).textContent='Engaged';
  // empty slots
  points.forEach((p,i)=>{if(p.v==null){el('rect',{x:xAt(i),y:vBase-3,width:bw,height:3,rx:1.5,fill:'var(--empty)'},svg);
    if(style==='mirror')el('rect',{x:xAt(i),y:eBase,width:bw,height:3,rx:1.5,fill:'var(--empty)'},svg)}});
  // views bars
  points.forEach((p,i)=>{if(p.v==null)return;const hv=p.v/vMax*(vBase-vTop);
    if(p.v>0)el('path',{d:bar(xAt(i),vBase,bw,Math.max(2,hv),true),fill:'var(--pc,var(--views))'},svg);
    else el('rect',{x:xAt(i),y:vBase-2,width:bw,height:2,fill:'var(--pc,var(--views))',opacity:.35},svg)});
  // engagement
  if(style==='twin'){
    let d='',started=false;const dots=[];
    points.forEach((p,i)=>{if(p.e==null){started=false;return}const x=xAt(i)+bw/2,y=eBase-p.e/eMax*(eBase-eTop);
      d+=(started?'L':'M')+x.toFixed(1)+','+y.toFixed(1);started=true;dots.push([x,y])});
    el('path',{d,fill:'none',stroke:'var(--eng)','stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'},svg);
    dots.forEach(([x,y],k)=>{const last=k===dots.length-1;el('circle',{cx:x,cy:y,r:last?4:2.6,fill:last?'var(--eng)':'var(--bg)',stroke:'var(--eng)','stroke-width':2},svg)});
  }else{
    points.forEach((p,i)=>{if(p.e==null||p.e<=0)return;const he=p.e/eMax*(eTop-eBase);
      el('path',{d:bar(xAt(i)+bw*0.15,eBase+2,bw*0.7,Math.max(2,he-2),false),fill:'var(--eng)'},svg)});
  }
  // method-change markers
  (opt.events||[]).forEach(ev=>{
    const i=points.findIndex(p=>weekly?(ev.d>=p.d&&ev.d<new Date(p.d.getTime()+7*DAY)):sameDay(p.d,ev.d));
    let x;if(i>=0)x=weekly?padL+i*step+step/2:padL+i*step;else if(ev.d>points[n-1].d)x=W-padR-1;else return;
    mk.push({i,ev});
    el('line',{x1:x,x2:x,y1:vTop-2,y2:style==='twin'?eBase:eTop,stroke:'var(--eng)','stroke-width':1.5,'stroke-dasharray':'3 3'},svg);
    el('path',{d:`M${x-4},1L${x+4},1L${x},8Z`,fill:'var(--eng)'},svg)});
  defaultCap();
  const evAt=i=>mk.filter(m=>m.i===i).map(m=>m.ev.title).join(', ');
  // x labels
  const lblY=H-6;
  if(!weekly){points.forEach((p,i)=>{el('text',{x:xAt(i)+bw/2,y:lblY,'text-anchor':'middle'},svg).textContent=i===n-1&&sameDay(p.d,YD)?'Yesterday':['S','M','T','W','T','F','S'][p.d.getDay()]})}
  else{let lastM=-1;points.forEach((p,i)=>{const m=p.d.getMonth();if(m!==lastM&&i<n-1){el('text',{x:padL+i*step,y:lblY,'text-anchor':'start'},svg).textContent=MON[m];lastM=m}})}
  // first-data marker on 6-month charts
  if(weekly){const fi=points.findIndex(p=>p.v!=null);
    if(fi>2){const x=padL+fi*step-1;el('line',{x1:x,x2:x,y1:vTop,y2:style==='twin'?eBase:eTop,stroke:'var(--mute)','stroke-dasharray':'2 3',opacity:.7},svg);
      const t=el('text',{x:x-4,y:(vTop+vBase)/2+4,'text-anchor':'end'},svg);t.textContent='Tracking starts';

    if(tl.length){const t=h('div','posts');t.append(h('div','sec-t',`<span>Most downloaded</span><em>last 30 days, any release date</em>`));
      const tm=Math.max(...tl.map(x=>x.n),1),tr=h('div','mini-rows');
      tl.forEach((x,i)=>tr.append(h('div','mini-row',`<span class="nm"><span>${i+1}${x.code?`<small>${x.code.replace('S0','S').replace(' - ','·')}</small>`:''}</span></span><span><span style="font-size:12px">${x.title}</span><span class="bar" style="display:block;margin-top:3px"><i style="width:${Math.max(2,x.n/tm*100)}%"></i></span></span><b class="num">${x.n}</b>`)));
      t.append(tr);out.push(t)}}
  const e=h('div','posts');e.append(h('div','sec-t',`<span>Episodes</span><em>downloads each, newest first</em>`));
  const mr=h('div','mini-rows'),mx=Math.max(...R.episodes.map(x=>x.n),1);
  R.episodes.forEach(x=>mr.append(h('div','mini-row',`<span class="nm"><span>${x.code.replace('S0','S').replace(' - ','·')}<small>${x.date.slice(5).replace('-','/')}</small></span></span><span><span style="font-size:12px">${x.title}</span><span class="bar" style="display:block;margin-top:3px"><i style="width:${Math.max(2,x.n/mx*100)}%"></i></span></span><b class="num">${x.n}</b>`)));
  e.append(mr);out.push(e);
  out.push(h('div','foot','<span>Downloads come from RSS.com and cover Apple Podcasts, Spotify, Amazon Music and the rest. They are not the same as plays on social, so they are not added to the goal totals.</span>'));
  return out}
function compareBlock(){
  const order=['yt','fb','ig','tt'].filter(k=>DATA.by_type&&DATA.by_type[k]&&DATA.by_type[k].periods.length);
  const out=[h('div','plat-h','<b>Compare</b><small>which kind of post works</small>')];
  if(!order.length){out.push(h('div','empty-note','Fills in once posts are tracked.'));return out}
  const names=[['nature','Nature'],['hear','Nature-Hear'],['promo','Promo'],['tomorrow',"Tomorrow's (ended)"]],EARLY=8;
  const cur=order.map(k=>({k,p:DATA.platforms.find(x=>x.key===k),per:DATA.by_type[k].periods[0]}));
  const sec=h('div','posts');
  sec.append(h('div','sec-t','<span>Right now</span><em>typical views per post, current method</em>'));
  const g=h('div','tgrid num');g.style.gridTemplateColumns=`1.4fr repeat(${cur.length},1fr)`;
  g.append(h('span','th',''),...cur.map(c=>h('span','th',`${c.p.name}<br>${c.per.label}`)));
  const best=cur.map(c=>{const ok=names.filter(([k])=>c.per.types[k]&&c.per.types[k].n>=EARLY);
    const w=ok.length>1?ok.reduce((a,b)=>c.per.types[b[0]].med>c.per.types[a[0]].med?b:a)[0]:null;return w&&c.per.types[w].med>0?w:null});
  names.filter(([k])=>k!=='tomorrow').forEach(([k,label])=>{g.append(h('span','tn',label));
    cur.forEach((c,i)=>{const t=c.per.types[k];
      g.append(t?h('span','tc'+(t.n<EARLY?' early':'')+(best[i]===k?' best':''),`<b>${full(t.med)}</b><small>${t.n} post${t.n===1?'':'s'}${t.n<EARLY?' · early':''}</small>`):h('span','tc early','<b>—</b>'))})});
  sec.append(g,h('div','sum',`<span>Median views per post, only posts at least 3 days old. “Early” means fewer than ${EARLY} posts, so don't trust it yet. The bold amber number is the best type for that platform once there are enough posts. Each type goes out at its own time of day, so a gap can be timing rather than type.</span>`));
  out.push(sec);
  out.push(h('div','sec-t','<span>Platform by platform</span><em>columns split where the posting method changed</em>'));
  order.forEach(k=>out.push(...typesBlock(DATA.platforms.find(x=>x.key===k),true)));
  out.push(h('div','sum',`<span>Nature-Hear began 11/16. Tomorrow's-episode posts ended 11/8. Earlier columns are kept so you can see how each type did before.</span>`));
  return out}

/* ---------- lifetime goal: simple line chart ---------- */
function lineChart(pts,opt){
  const W=360,H=104,padL=34,padR=10,top=10,base=84,wrap=h('div','chart');
  const cap=h('div','chart-cap');cap.append(h('span',null,opt.title),h('span',null,opt.sub||''));
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':opt.title});wrap.append(cap,svg);
  const ys=pts.map(p=>p.y).filter(y=>y!=null);
  if(ys.length<2){const t=el('text',{x:W/2,y:50,'text-anchor':'middle'},svg);t.textContent=opt.empty||'Fills in as weeks are tracked';return wrap}
  const yMax=nice(Math.max(1e-9,...ys,opt.target||0)*1.05),x=i=>padL+i*(W-padL-padR)/Math.max(1,pts.length-1),y=v=>base-(v/yMax)*(base-top);
  [0,yMax].forEach(v=>{el('line',{x1:padL,x2:W-padR,y1:y(v),y2:y(v),stroke:'var(--line)','stroke-width':1},svg);
    const t=el('text',{x:padL-4,y:y(v)+3,'text-anchor':'end'},svg);t.textContent=opt.fmtY(v)});
  if(opt.target!=null){el('line',{x1:padL,x2:W-padR,y1:y(opt.target),y2:y(opt.target),stroke:'var(--eng)','stroke-width':1.5,'stroke-dasharray':'4 3'},svg);
}
  let dstr='';pts.forEach((p,i)=>{if(p.y!=null)dstr+=(dstr?'L':'M')+x(i).toFixed(1)+','+y(p.y).toFixed(1)});
  el('path',{d:dstr,fill:'none',stroke:opt.color,'stroke-width':2.2,'stroke-linejoin':'round','stroke-linecap':'round'},svg);
  let li=pts.length-1;while(li>0&&pts[li].y==null)li--;el('circle',{cx:x(li),cy:y(pts[li].y),r:3.5,fill:opt.color},svg);
  let lastM=-1;pts.forEach((p,i)=>{const m=p.d.getMonth();if(m!==lastM&&p.d.getDate()<=7||i===0){lastM=m;const t=el('text',{x:x(i),y:H-4,'text-anchor':i===0?'start':'middle'},svg);t.textContent=MON[m]}});
  return wrap}

function goalBlock(live,combined){
  const G=DATA.goal;if(!G||!G.interactions)return null;
  const baseV=live.reduce((s,p)=>s+(p.before?p.before.v:0),0),baseE=live.reduce((s,p)=>s+(p.before?p.before.e:0),0);
  const first=Math.max(0,combined.findIndex(x=>x.v!=null)),wk=combined.slice(first);
  let a=baseV,b=baseE;const cv=[],ce=[];
  wk.forEach(x=>{a+=x.v||0;b+=x.e||0;cv.push({d:x.d,y:a});ce.push({d:x.d,y:b})});
  const TV=a,TE=b,pct=(v,g)=>g?Math.min(100,v/g*100):0,pf=(v,g)=>g?(v/g*100).toFixed(1)+'%':'';
  const last4=wk.slice(-4),pace=sum(last4,'e')/Math.max(1,last4.length),paceV=sum(last4,'v')/Math.max(1,last4.length);
  const need=G.views?G.interactions/G.views*100:null;
  const rt=wk.map(x=>({d:x.d,y:x.v>=200?x.e/x.v*100:null}));
  const rate4=sum(last4,'v')?sum(last4,'e')/sum(last4,'v')*100:null;
  const box=h('div','goal');
  box.append(h('h3',null,'Lifetime goal'));
  const card=(label,val,goalN,unit)=>h('div',null,`<div class="gtop num"><b>${full(val)}</b><span>of ${full(goalN)} ${unit}</span><em>${pf(val,goalN)}</em></div><div class="gbar" role="progressbar" aria-label="${label}" aria-valuenow="${Math.round(pct(val,goalN))}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct(val,goalN).toFixed(1)}%"></i></div>`);
  const s1=h('div','gsub');s1.style.borderTop='0';s1.style.paddingTop='0';
  s1.append(card('Interactions',TE,G.interactions,'interactions'),
    lineChart(ce,{title:'Interactions, running total',sub:'by week',color:'var(--eng)',fmtY:fmt}),
    h('div','gnote',pace>0&&TE<G.interactions?`Last 4 weeks: about ${full(Math.round(pace))} interactions a week. At that pace, roughly ${full(Math.ceil((G.interactions-TE)/pace))} more weeks. No deadline, just a pace check.`:`No deadline. Interactions are the Engaged number: likes or reactions, comments, shares and saves.`));
  box.append(s1);
  if(G.views){const s2=h('div','gsub');
    s2.append(card('Views',TV,G.views,'views, the estimate the goal needs'),
      lineChart(cv,{title:'Views, running total',sub:'by week',color:'var(--views)',fmtY:fmt}),
      h('div','gnote',paceV>0?`Last 4 weeks: about ${full(Math.round(paceV))} views a week.`:''));box.append(s2)}
  if(need!=null){const s3=h('div','gsub');
    s3.append(lineChart(rt,{title:'Interaction rate by week',sub:rate4!=null?`last 4 weeks ${rate4.toFixed(1)}% · lifetime ${rate(TV,TE)}`:'',color:'var(--views)',target:need,targetLabel:`goal assumes ${need.toFixed(1)}%`,fmtY:v=>v.toFixed(0)+'%'}),
      h('div','gnote',`The dashed line is the ${need.toFixed(1)}% the goal assumes. The views goal is the interactions goal divided by this rate. If the rate climbs above it, fewer views are needed. Weeks under 200 views are left out.`));box.append(s3)}
  return box}

/* ---------- C: overview + one platform at a time ---------- */
function layoutC(root){
  root.className='page narrow';
  root.append(head());
  // scoreboard: three stacked panes (7 days, 6 months, all time), only the selected one visible
  const live=DATA.platforms.filter(p=>p.daily);
  if(!live.length){root.append(h('div','empty-note','No numbers yet. The first nightly run fills this in.'));return}
  const tot=(r,p)=>{if(!p.daily)return null;if(r==='7d')return {v:sum(cur(p),'v'),e:sum(cur(p),'e')};
    const w=p.weekly.filter(x=>x.v!=null),t={v:sum(w,'v'),e:sum(w,'e')};
    if(r==='all'&&p.before){t.v+=p.before.v;t.e+=p.before.e}return t};
  const combined=live[0].weekly.map((x,i)=>{const ws=live.map(p=>p.weekly[i]).filter(w=>w.v!=null);
    return {d:x.d,v:ws.length?sum(ws,'v'):null,e:ws.length?sum(ws,'e'):null}});
  const RANGES=[['7d','7 days','All channels · last 7 days'],['6m','6 months','All channels · last 6 months'],['all','All time','All channels · since each began']];
  const board=h('section','board-c');
  const rtabs=h('div','rtabs');rtabs.setAttribute('role','tablist');rtabs.setAttribute('aria-label','Time range');
  const panes={};
  RANGES.forEach(([r,label,head])=>{
    const ts=live.map(p=>tot(r,p)),TV=sum(ts,'v'),TE=sum(ts,'e');
    let dtxt='';if(r==='7d'){const dt=delta(TV,live.reduce((s,p)=>s+sum(prev(p),'v'),0));dtxt=` <span class="delta ${dt.c}">${dt.t}</span>`}
    const pane=h('div','pane');pane.id='pane-'+r;pane.setAttribute('role','tabpanel');
    pane.append(h('div','sec-t',`<span>${head}</span>`),
      h('div','big',`<div><b>${fmt(TV)}</b><span>Views${dtxt}</span></div><div><b>${full(TE)}</b><span>Engaged</span></div><div><b>${rate(TV,TE)}</b><span>Rate</span></div>`));
    if(r==='all'){const gb=goalBlock(live,combined);if(gb)pane.append(gb)}
    if(r==='6m')pane.append(chart(combined,{title:'All channels by week',sub:'views + engaged',style:'twin',weekly:true}));
    const rows=h('div','mini-rows');const mx=Math.max(1,...ts.map(t=>t.v));
    DATA.platforms.filter(p=>p.key!=='pin').forEach(p=>{const t=tot(r,p);
      const nm=`<span class="nm">${ico(p.key)}<span>${p.name}${r==='all'?`<small>${(p.since?'since '+p.since:'starts this week')+(p.stopped?' · stopped '+md(p.stopped):'')}</small>`:''}</span></span>`;
      const row=h('div','mini-row num',`${nm}<span class="bar"><i style="width:${t?Math.max(1.5,t.v/mx*100):0}%"></i></span><span>${t?fmt(t.v):'—'}</span>`);row.style.setProperty('--pc',`var(--${p.key})`);rows.append(row)});
    if(DATA.rss){const R=DATA.rss,v=r==='7d'?R.downloads.d7:R.downloads.all;
      const row=h('div','mini-row num',`<span class="nm">${ico('rss')}<span>RSS<small>downloads${r==='6m'?' · all time':''}</small></span></span><span class="bar"><i style="width:${Math.max(1.5,v/mx*100)}%"></i></span><span>${fmt(v)}</span>`);row.style.setProperty('--pc','var(--views)');rows.append(row)}
    pane.append(rows);panes[r]=pane;
    const b=h('button',null,label);b.type='button';b.id='range-'+r;b.dataset.r=r;b.setAttribute('role','tab');b.setAttribute('aria-controls',pane.id);
    b.addEventListener('click',()=>pickR(r));rtabs.append(b)});
  const pickR=r=>{[...rtabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.r===r));
    for(const k in panes)panes[k].hidden=k!==r;try{localStorage.setItem('wwj-reach-range',r)}catch(e){}};
  board.append(rtabs,...Object.values(panes));root.append(board);
  let rr='7d';try{rr=localStorage.getItem('wwj-reach-range')||'7d'}catch(e){}
  pickR(panes[rr]?rr:'7d');
  const tabs=h('div','tabs');tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','Platform');
  const panel=h('section','plat');panel.setAttribute('role','tabpanel');
  const pick=(k,tap)=>{const p=DATA.platforms.find(x=>x.key===k);panel.style.setProperty('--pc',(k==='compare'||k==='rss')?'var(--views)':`var(--${k})`);[...tabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));
    if(k==='compare')panel.replaceChildren(...compareBlock());else if(k==='rss')panel.replaceChildren(...rssBlock());else panel.replaceChildren(...[platHead(p),statLine(p),changesPlat(p)].filter(Boolean),legend(),...charts(p,'twin'),...splitBlock(p),...postsBlock(p));try{localStorage.setItem('wwj-reach-tab',k)}catch(e){}
    if(tap){const r=panel.getBoundingClientRect();if(r.top<0||r.top>innerHeight*0.6)panel.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}};
  DATA.platforms.filter(p=>p.key!=='pin').forEach(p=>{const b=h('button',null,`${ico(p.key,'')}${p.name}`);b.style.setProperty('--pc',`var(--${p.key})`);b.type='button';b.id='tab-'+p.key;b.dataset.k=p.key;b.setAttribute('role','tab');b.addEventListener('click',()=>pick(p.key,true));tabs.append(b)});
  {const b=h('button',null,`${ico('compare','')}Compare`);b.style.setProperty('--pc','var(--views)');b.type='button';b.id='tab-compare';b.dataset.k='compare';b.setAttribute('role','tab');b.addEventListener('click',()=>pick('compare',true));tabs.append(b)}
  if(DATA.rss){const b=h('button',null,`${ico('rss','')}RSS`);b.style.setProperty('--pc','var(--views)');b.type='button';b.id='tab-rss';b.dataset.k='rss';b.setAttribute('role','tab');b.addEventListener('click',()=>pick('rss',true));tabs.append(b)}
  root.append(panel,foot());
  const bar=h('nav','tabbar');bar.append(tabs);document.body.append(bar);document.body.classList.add('has-bar');
  let k='fb';try{k=localStorage.getItem('wwj-reach-tab')||'fb'}catch(e){}
  pick(k==='compare'||(k==='rss'&&DATA.rss)||DATA.platforms.some(p=>p.key===k&&p.key!=='pin')?k:'fb');
}
function foot(){return h('div','foot',`<span>Views follow each platform's own count: plays on YouTube, Instagram and TikTok, and content views on Facebook.</span><span>Engaged adds likes or reactions, comments, shares and saves. On Facebook it is Meta's post engagement count, which also includes clicks.</span><span>YouTube and Facebook report their own history. Instagram, TikTok and Pinterest come from Buffer, which only keeps 31 days, so each night's totals are saved to build the longer graphs.</span><span>YouTube's Shorts vs long-form split uses YouTube's own content-type tag. Live streams count as long-form.</span><span>YouTube reports a day or two late, so its graphs stop at the last day it has reported. The date is next to its name.</span><span>For Instagram, TikTok and Pinterest, history from before tracking began counts each post's views on the day it was posted, not the days people watched it.</span>`)}

layoutC(document.getElementById('app'));
})();
</script>
